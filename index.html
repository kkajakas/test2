<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // 1. Paste your exported GeoJSON inside this object
        var myArea = {
          "type": "FeatureCollection",
          "features": [
              // {"type": "Feature", ... }
          ]
        };

        // Draw the GeoJSON and zoom to it
        var areaLayer = L.geoJSON(myArea).addTo(map);
        if (myArea.features.length > 0) map.fitBounds(areaLayer.getBounds());

        // 2. Track Phone Location
        var marker, circle;
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(pos) {
                var lat = pos.coords.latitude;
                var lng = pos.coords.longitude;
                
                if (marker) { map.removeLayer(marker); map.removeLayer(circle); }
                
                marker = L.marker([lat, lng]).addTo(map);
                circle = L.circle([lat, lng], { radius: pos.coords.accuracy }).addTo(map);
            }, function(err) { console.error(err); }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
